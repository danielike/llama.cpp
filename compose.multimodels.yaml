services:
  llama-server:
    build:
      context: .
      dockerfile: .devops/rocm.Dockerfile
    image: llama-cpp:rocm
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - 105
      # If needed, add the host's render group numeric GID here:
      # - "${RENDER_GID}"
    ipc: host
    ulimits:
      memlock: -1
    cap_add:
      - IPC_LOCK
    ports:
      - "1141:1141"
    volumes:
      - "${MODEL_DIR:-~/models}:/models:ro"
      - llama-data:/data
    command:
      - --models-preset
      - "/models/models-preset.ini"
      - --models-max
      - "1"
      - --models-autoload
      - --host
      - 0.0.0.0
      - --port
      - "1141"
      - --tools
      - all
    restart: unless-stopped

volumes:
  llama-data:
