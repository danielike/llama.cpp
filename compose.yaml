services:
  llama-server:
    build:
      context: .
      dockerfile: .devops/rocm.Dockerfile
    image: llama-cpp:rocm
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - 105
      # If needed, add the host's render group numeric GID here:
      # - "${RENDER_GID}"
    ipc: host
    ulimits:
      memlock: -1
    cap_add:
      - IPC_LOCK
    ports:
      - "1141:1141"
    volumes:
      - "${MODEL_DIR:-~/models}:/models:ro"
      - llama-data:/data
    command:
      - -m
      - "/models/${MODEL_FILE:-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf}"
      - --mmproj
      - "/models/${MODEL_FILE:-mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf}"
      - --host
      - 0.0.0.0
      - --port
      - "1141"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --fit-target
      - "512"
      - -ub
      - "1024"
      - --moe-cache-mib
      - "2048"
      - --reasoning
      - on
      - --tools
      - all
      - -t
      - "4"
      - -c
      - "256000"
    restart: unless-stopped

volumes:
  llama-data:
